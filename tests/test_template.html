<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'IRTitr';
    src: local('IRTitr'), url('file:///C:/Windows/Fonts/IRTitr.ttf');
  }
  @font-face {
    font-family: 'IRLotus';
    src: local('IRLotus Bold'), local('IRlotus'), url('file:///C:/Windows/Fonts/IRLotusBold.ttf');
    font-weight: bold;
  }
  
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    position: relative;
    background-color: transparent;
  }
  
  .post-card {
    width: 1080px;
    height: 1920px;
    position: relative;
    background: url('file:///d:/rozetext-framework/assets/clean_templates/clean_dark_text.png') center center no-repeat;
    background-size: cover;
  }
  
  .content-box {
    position: absolute;
    top: 480px;
    right: 140px;
    width: 800px;
    font-family: 'IRLotus', sans-serif;
    font-weight: bold;
    font-size: 54px;
    line-height: 94px;
    text-align: right;
    color: #F1EFE8;
  }
  
  .hl-dark {
    color: #F4C466;
  }
</style>
</head>
<body>
  <div class="post-card">
    <div class="content-box">
      <div class="hl-dark">این اخلاقمو دوست دارم</div>
      <div class="hl-dark">اینکه سر مشکلاتم آدم پرروییم.</div>
      <div>میشینم غصمو میخورم ناراحتمو میشم</div>
      <div>اما بعدش یه جوری بلند میشم</div>
      <div>و با یه نسخه جدیدی از خودم ادامه میدم که</div>
      <div>انگار اصلا من نبودم</div>
      <div>که تا دو روز پیش لب پرتگاه فروپاشی بودم.</div>
      <div class="hl-dark">آره شاید بزرگ‌ترین ویژگیم همین باشه:</div>
      <div class="hl-dark">ادامه دادن اونم وقتی که ادامه دادن محاله ..</div>
    </div>
  </div>
</body>
</html>
